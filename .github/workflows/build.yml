name: Build
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
    - cron: '45 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      llama-tag: ${{ steps.tags.outputs.llama-tag }}
      current-tag: ${{ steps.tags.outputs.current-tag }}
    steps:
      - name: Fetch latest llama.cpp release
        id: llamatag
        run: |
          LLAMA_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=100" \
            | jq -r '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')
          if [ -z "$LLAMA_TAG" ] || [ "$LLAMA_TAG" = "null" ]; then
            echo "No llama.cpp release found"
            exit 1
          fi
          echo "Found llama.cpp tag: $LLAMA_TAG"
          echo "name=${LLAMA_TAG}" >> "$GITHUB_OUTPUT"
      - name: Fetch latest own release
        id: currenttag
        run: |
          CURRENT_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')
          if [ "$CURRENT_TAG" = "null" ]; then CURRENT_TAG=""; fi
          echo "Found own tag: $CURRENT_TAG"
          echo "name=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
      - name: Save tags
        id: tags
        run: |
          echo "llama-tag=${{ steps.llamatag.outputs.name }}" >> "$GITHUB_OUTPUT"
          echo "current-tag=${{ steps.currenttag.outputs.name }}" >> "$GITHUB_OUTPUT"

  build-cuda-13-amd64:
    needs: check-version
    if: ${{ needs.check-version.outputs.llama-tag != needs.check-version.outputs.current-tag }}
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.2-devel-ubuntu24.04
      options: --platform linux/amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout llama.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp
          ref: ${{ needs.check-version.outputs.llama-tag }}
          fetch-tags: 'true'
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
            apt update
            apt install -y build-essential ninja-build libgomp1 git libssl-dev libcurl4-openssl-dev zip wget
      - name: Setup cmake 4.2.0
        run: |
          mkdir -p ./cmake-4.2.0
          cd ./cmake-4.2.0
          wget -O cmake.sh https://github.com/Kitware/CMake/releases/download/v4.2.0/cmake-4.2.0-linux-x86_64.sh
          sh cmake.sh --prefix=/usr/local --skip-license
          cd ..
          rm -rf cmake-4.2.0
      - name: Build amd64
        working-directory: llama.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--allow-shlib-undefined" \
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90" \
            -DCMAKE_DISABLE_FIND_PACKAGE_NCCL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_CUB_3DOT2=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DGGML_BACKEND_DL=ON
          cmake --build build --config Release -j $(nproc)
      - name: Pack artifacts
        run: |
          tar -czvf llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-x64.tar.gz --transform "s,./,llama-${{ needs.check-version.outputs.llama-tag }}/," -C ./llama.cpp/build/bin .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-x64.tar.gz
          name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-x64.tar.gz
          archive: false

  release:
    needs: 
      - check-version
      - build-cuda-13-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Download amd64 CUDA 13 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-x64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create final release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-version.outputs.llama-tag }}
          commit: main
          makeLatest: true
          body: |
            ## Changes in llama.cpp ${{ needs.check-version.outputs.llama-tag }}
            See the [llama.cpp releases](https://github.com/ggml-org/llama.cpp/releases/tag/${{ needs.check-version.outputs.llama-tag }}) for details.
          artifacts: "*.tar.gz"
