name: Cleanup Older Releases

on:
  workflow_dispatch: 

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to delete tags and releases

    steps:
      - name: Keep 3 Newest Releases and Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch releases
          RELEASES=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")
          
          # Tags to keep (newest 3 releases)
          KEEP_TAGS=$(echo "$RELEASES" | jq -r '.[0:3][] | .tag_name')
          
          # Delete older releases
          echo "$RELEASES" |
          jq -c '.[3:][]' |
          while read release; do
              id=$(echo "$release" | jq -r '.id')
              tag=$(echo "$release" | jq -r '.tag_name')
          
              echo "Deleting release $tag"
          
              curl -fsSL \
                -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/releases/$id"
          done
          
          # Fetch tags
          TAGS=$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/tags?per_page=100")
          
          echo "$TAGS" |
          jq -r '.[].name' |
          while read tag; do
              if ! echo "$KEEP_TAGS" | grep -Fxq "$tag"; then
                  echo "Deleting orphaned tag $tag"
          
                  curl -fsSL \
                    -X DELETE \
                    -H "Authorization: Bearer $GITHUB_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$tag"
              fi
          done
